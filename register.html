<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - ShopEasy</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <div class="brand">
        🛒 ShopEasy
    </div>

    <nav id="nav"></nav>

</header>


<main class="form-page">

    <div class="form-card">

        <h2>📝 Create Account</h2>

        <p class="muted">
            Register to start shopping.
        </p>


        <form id="registerForm">

            <input
                id="firstName"
                placeholder="First Name"
                required
            >

            <input
                id="lastName"
                placeholder="Last Name"
                required
            >

            <input
                id="email"
                type="email"
                placeholder="Email Address"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm Password"
                required
            >

            <button
                type="submit"
                class="btn full">

                Create Account

            </button>

        </form>


        <p id="registerMessage"
           class="message">
        </p>


        <p>
            Already registered?
            <a href="login.html">Login</a>
        </p>

    </div>

</main>




<script src="script.js"></script>

</body>
</html>
