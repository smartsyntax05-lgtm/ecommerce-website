<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Products - ShopEasy</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <div class="brand">
        🛒 ShopEasy
    </div>

    <nav id="nav"></nav>

</header>


<main class="container">

    <div class="page-heading">

        <div>

            <h1>
                🛍️ Products
            </h1>

            <p class="muted">
                Browse our complete product collection.
            </p>

        </div>


        <a href="cart.html"
           class="btn secondary">

            View Cart 🛒

        </a>

    </div>


    <div class="categories">

        <button
            class="category active"
            data-category="All">

            All

        </button>

        <button
            class="category"
            data-category="Electronics">

            📱 Electronics

        </button>

        <button
            class="category"
            data-category="Fashion">

            👕 Fashion

        </button>

        <button
            class="category"
            data-category="Accessories">

            🎒 Accessories

        </button>

        <button
            class="category"
            data-category="Home">

            🏠 Home

        </button>

    </div>


    <div
        id="productList"
        class="products">

    </div>

</main>



<script src="script.js"></script>

</body>
</html>
