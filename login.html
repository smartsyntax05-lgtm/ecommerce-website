<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ShopEasy</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <div class="brand">
        🛒 ShopEasy
    </div>

    <nav id="nav"></nav>

</header>


<main class="form-page">

    <div class="form-card">

        <h2>🔐 Login</h2>

        <p class="muted">
            Login to your ShopEasy account.
        </p>


        <form id="loginForm">

            <input
                id="loginEmail"
                type="email"
                placeholder="Email Address"
                required
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="btn full">

                Login

            </button>

        </form>


        <p id="loginMessage"
           class="message">
        </p>


        <p>
            New customer?
            <a href="register.html">
                Create Account
            </a>
        </p>

    </div>

</main>




<script src="script.js"></script>

</body>
</html>
