<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - ShopEasy</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <div class="brand">
        🛒 ShopEasy
    </div>

    <nav id="nav"></nav>

</header>


<main class="form-page">

    <div class="form-card">

        <h2>
            👤 My Profile
        </h2>

        <p class="muted">
            Update your customer details.
        </p>


        <form id="profileForm">

            <input
                id="profileName"
                placeholder="Full Name"
                required
            >


            <input
                id="profileEmail"
                type="email"
                placeholder="Email"
                required
            >


            <input
                id="profileMobile"
                placeholder="Mobile Number"
                required
            >


            <input
                id="profileAddress"
                placeholder="Address"
                required
            >


            <button
                type="submit"
                class="btn full">

                Save Profile

            </button>

        </form>


        <p
            id="profileMessage"
            class="message">

        </p>

    </div>

</main>




<script src="script.js"></script>

</body>
</html>
